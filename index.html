<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bughunter.uk — Learn</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2333;
      --border: rgba(255,255,255,0.1);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #f0a500;
      --accent-dim: rgba(240,165,0,0.12);
      --green: #3fb950;
      --critical: #f85149;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .logo { color: var(--accent); font-weight: 700; font-size: 1rem; text-decoration: none; }
    .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; }
    .app { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 49px); }
    .sidebar { width: 260px; min-width: 260px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); }
    .sidebar-title { padding: 1rem; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
    .challenge-item { padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.1s; }
    .challenge-item:hover { background: rgba(255,255,255,0.04); }
    .challenge-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
    .challenge-item-title { font-size: 0.88rem; font-weight: 500; }
    .challenge-item-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; display: flex; gap: 0.5rem; align-items: center; }
    .diff-badge { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 600; }
    .diff-easy { background: rgba(63,185,80,0.2); color: var(--green); }
    .diff-medium { background: rgba(240,165,0,0.2); color: var(--accent); }
    .diff-hard { background: rgba(248,81,73,0.2); color: var(--critical); }
    .check-icon { color: var(--green); }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .content-area { display: flex; flex: 1; overflow: hidden; }
    .description-panel { width: 40%; min-width: 300px; border-right: 1px solid var(--border); overflow-y: auto; padding: 1.5rem; }
    .challenge-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .challenge-meta { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .points-badge { font-size: 0.75rem; background: var(--accent-dim); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; }
    .description-text { font-size: 0.9rem; line-height: 1.8; white-space: pre-wrap; }
    .description-text code { background: var(--surface2); padding: 0.1rem 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.85em; color: var(--accent); }
    .flag-area { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .flag-area h3 { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .flag-input-row { display: flex; gap: 0.5rem; }
    .flag-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 0.8rem; border-radius: 6px; font-family: monospace; font-size: 0.88rem; }
    .flag-input:focus { outline: none; border-color: var(--accent); }
    .btn-submit { background: var(--accent); color: #000; border: none; padding: 0.6rem 1.1rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
    .btn-submit:disabled { opacity: 0.5; cursor: default; }
    .flag-result { margin-top: 0.6rem; font-size: 0.85rem; }
    .flag-result.correct { color: var(--green); }
    .flag-result.wrong { color: var(--critical); }
    .terminal-panel { flex: 1; display: flex; flex-direction: column; background: #0d1117; }
    .terminal-header { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; background: var(--surface2); }
    .terminal-dots { display: flex; gap: 0.4rem; }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #28c840; }
    .terminal-title { font-size: 0.78rem; color: var(--text-muted); margin-left: 0.5rem; font-family: monospace; }
    .terminal-body { flex: 1; overflow-y: auto; padding: 1rem; font-family: "Courier New", Courier, monospace; font-size: 0.85rem; line-height: 1.6; }
    .terminal-line { margin-bottom: 0.2rem; }
    .terminal-prompt { color: #3fb950; }
    .terminal-cmd { color: var(--text); }
    .terminal-output { color: #b4f0a0; white-space: pre-wrap; word-break: break-all; }
    .terminal-error { color: var(--critical); white-space: pre-wrap; }
    .terminal-input-row { display: flex; align-items: center; padding: 0.75rem 1rem; border-top: 1px solid var(--border); gap: 0.5rem; }
    .terminal-prompt-label { color: #3fb950; font-family: monospace; font-size: 0.85rem; white-space: nowrap; }
    .terminal-input { flex: 1; background: transparent; border: none; color: var(--text); font-family: "Courier New", Courier, monospace; font-size: 0.85rem; outline: none; }
    .terminal-clear-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.25rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .terminal-clear-btn:hover { background: rgba(255,255,255,0.06); }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 0.5rem; }
    .empty-state-icon { font-size: 2.5rem; }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="https://bughunter.uk">bughunter.uk / learn</a>
    <div class="header-right">
      <span id="login-status" style="color:var(--text-muted);font-size:0.85rem">未ログイン</span>
    </div>
  </header>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-title">チャレンジ</div>
      <div id="challenge-list"><div class="spinner"></div></div>
    </div>
    <div class="main">
      <div class="content-area" id="content-area">
        <div class="empty-state">
          <div class="empty-state-icon">💻</div>
          <p>チャレンジを選んでください</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CTF_API = "https://ctfapi.bughunter.uk";
    let challenges = [], completions = new Set(), currentChallenge = null;
    let cmdHistory = [], historyIdx = -1, sessionToken = null;

    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function getSession() {
      try { return JSON.parse(localStorage.getItem("bbp_session") || "null"); } catch { return null; }
    }

    async function init() {
      const session = getSession();
      if (session?.token && session?.userType === "hunter") {
        sessionToken = session.token;
        document.getElementById("login-status").textContent = "@" + (session.name || "ログイン中");
      } else {
        document.getElementById("login-status").innerHTML = '<a href="https://bughunter.uk" style="color:var(--accent)">ログインしてスコアを記録</a>';
      }

      try {
        const res = await fetch(`${CTF_API}/challenges`);
        const data = await res.json();
        challenges = data.challenges || [];
      } catch {
        document.getElementById("challenge-list").innerHTML = '<p style="padding:1rem;color:var(--critical);font-size:0.85rem">読み込みに失敗しました</p>';
        return;
      }

      if (sessionToken) {
        try {
          const res = await fetch(`${CTF_API}/my/completions`, { headers: { Authorization: `Bearer ${sessionToken}` } });
          const data = await res.json();
          (data.completions || []).forEach(c => completions.add(String(c.challenge_id)));
        } catch {}
      }

      renderSidebar();
    }

    function renderSidebar() {
      const list = document.getElementById("challenge-list");
      if (!challenges.length) { list.innerHTML = '<p style="padding:1rem;color:var(--text-muted);font-size:0.85rem">チャレンジがありません</p>'; return; }
      const diffOrder = { easy:0, medium:1, hard:2 };
      const sorted = [...challenges].sort((a,b) => (diffOrder[a.difficulty]??9)-(diffOrder[b.difficulty]??9) || Number(a.order_index)-Number(b.order_index));
      list.innerHTML = sorted.map(ch => {
        const done = completions.has(String(ch.id));
        const diffLabel = { easy:"初級", medium:"中級", hard:"上級" }[ch.difficulty] || ch.difficulty;
        return `<div class="challenge-item${done?" completed":""}" data-id="${ch.id}">
          <div class="challenge-item-title">${done?'<span class="check-icon">✓ </span>':""}${esc(ch.title)}</div>
          <div class="challenge-item-meta">
            <span class="diff-badge diff-${esc(ch.difficulty)}">${esc(diffLabel)}</span>
            <span>${esc(String(ch.points))}pt</span>
          </div>
        </div>`;
      }).join("");
      list.querySelectorAll(".challenge-item").forEach(el => {
        el.addEventListener("click", () => selectChallenge(el.dataset.id));
      });
    }

    function selectChallenge(id) {
      currentChallenge = challenges.find(c => String(c.id) === String(id));
      if (!currentChallenge) return;
      document.querySelectorAll(".challenge-item").forEach(el => el.classList.toggle("active", el.dataset.id === String(id)));
      renderChallenge();
    }

    function formatDesc(text) {
      if (!text) return "";
      return esc(text).replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function renderChallenge() {
      const ch = currentChallenge;
      const done = completions.has(String(ch.id));
      const diffLabel = { easy:"初級", medium:"中級", hard:"上級" }[ch.difficulty] || ch.difficulty;
      document.getElementById("content-area").innerHTML = `
        <div class="description-panel">
          <div class="challenge-title">${esc(ch.title)}</div>
          <div class="challenge-meta">
            <span class="diff-badge diff-${esc(ch.difficulty)}">${esc(diffLabel)}</span>
            <span class="points-badge">${esc(String(ch.points))} pt</span>
            ${done?'<span style="color:var(--green);font-size:0.85rem">✓ クリア済み</span>':""}
          </div>
          <div class="description-text">${formatDesc(ch.description)}</div>
          <div class="flag-area">
            <h3>🚩 フラグを入力</h3>
            ${done
              ? '<p style="color:var(--green);font-size:0.88rem">✓ このチャレンジはクリア済みです</p>'
              : `<div class="flag-input-row">
                  <input class="flag-input" id="flag-input" placeholder="FLAG{...}" autocomplete="off">
                  <button class="btn-submit" id="flag-submit">送信</button>
                </div>
                <p class="flag-result" id="flag-result"></p>`
            }
          </div>
        </div>
        <div class="terminal-panel">
          <div class="terminal-header">
            <div class="terminal-dots">
              <div class="terminal-dot dot-red"></div>
              <div class="terminal-dot dot-yellow"></div>
              <div class="terminal-dot dot-green"></div>
            </div>
            <span class="terminal-title">hacker@bughunter:~$</span>
            <button class="terminal-clear-btn" id="term-clear" style="margin-left:auto">クリア</button>
          </div>
          <div class="terminal-body" id="terminal-body">
            <div class="terminal-line terminal-output">bughunter CTF — ${esc(ch.title)}</div>
            <div class="terminal-line terminal-output">コマンドを入力して問題を解いてください。</div>
            <div class="terminal-line">&nbsp;</div>
          </div>
          <div class="terminal-input-row">
            <span class="terminal-prompt-label">hacker@target:~$</span>
            <input class="terminal-input" id="terminal-input" placeholder="コマンドを入力..." autocomplete="off" autocorrect="off" spellcheck="false">
          </div>
        </div>`;

      const termInput = document.getElementById("terminal-input");
      const termBody = document.getElementById("terminal-body");
      cmdHistory = []; historyIdx = -1;
      termInput.focus();

      termInput.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          const cmd = termInput.value.trim();
          if (!cmd) return;
          cmdHistory.unshift(cmd); historyIdx = -1; termInput.value = "";
          await execCommand(cmd, ch.id, termBody);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (historyIdx < cmdHistory.length - 1) { historyIdx++; termInput.value = cmdHistory[historyIdx]; }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (historyIdx > 0) { historyIdx--; termInput.value = cmdHistory[historyIdx]; } else { historyIdx = -1; termInput.value = ""; }
        }
      });

      document.getElementById("term-clear").addEventListener("click", () => { termBody.innerHTML = ""; });

      if (!done) {
        const flagInput = document.getElementById("flag-input");
        const flagSubmit = document.getElementById("flag-submit");
        const flagResult = document.getElementById("flag-result");
        flagInput.addEventListener("keydown", (e) => { if (e.key === "Enter") flagSubmit.click(); });
        flagSubmit.addEventListener("click", async () => {
          const flag = flagInput.value.trim();
          if (!flag) return;
          flagSubmit.disabled = true;
          if (!sessionToken) {
            flagResult.textContent = "フラグを記録するにはログインが必要です";
            flagResult.className = "flag-result wrong";
            flagSubmit.disabled = false;
            return;
          }
          try {
            const res = await fetch(`${CTF_API}/challenges/${ch.id}/submit`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${sessionToken}` },
              body: JSON.stringify({ flag }),
            });
            const data = await res.json();
            if (data.correct) {
              flagResult.textContent = data.message || "正解！🎉";
              flagResult.className = "flag-result correct";
              completions.add(String(ch.id));
              renderSidebar();
              document.querySelectorAll(".challenge-item").forEach(el => el.classList.toggle("active", el.dataset.id === String(ch.id)));
            } else {
              flagResult.textContent = data.message || "フラグが違います";
              flagResult.className = "flag-result wrong";
            }
          } catch {
            flagResult.textContent = "送信に失敗しました";
            flagResult.className = "flag-result wrong";
          }
          flagSubmit.disabled = false;
        });
      }
    }

    async function execCommand(cmd, challengeId, termBody) {
      const cmdLine = document.createElement("div");
      cmdLine.className = "terminal-line";
      cmdLine.innerHTML = `<span class="terminal-prompt">hacker@target:~$</span> <span class="terminal-cmd">${esc(cmd)}</span>`;
      termBody.appendChild(cmdLine);
      try {
        const res = await fetch(`${CTF_API}/challenges/${challengeId}/exec`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: cmd }),
        });
        const data = await res.json();
        const outLine = document.createElement("div");
        outLine.className = "terminal-line terminal-output";
        outLine.textContent = data.output || "";
        termBody.appendChild(outLine);
      } catch {
        const errLine = document.createElement("div");
        errLine.className = "terminal-line terminal-error";
        errLine.textContent = "エラー: サーバーへの接続に失敗しました";
        termBody.appendChild(errLine);
      }
      const spacer = document.createElement("div");
      spacer.className = "terminal-line";
      spacer.innerHTML = "&nbsp;";
      termBody.appendChild(spacer);
      termBody.scrollTop = termBody.scrollHeight;
    }

    init();
  </script>
</body>
</html>
